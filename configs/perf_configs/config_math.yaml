# PerfAgent 基础配置 - MATH (数学推理)

max_iterations: 5
early_stop_no_improve: 3
adopt_only_if_improved: false
# MATH 评估: 1.0=正确, 0.0=错误 → 越大越好
metric_higher_is_better: true

logging:
  save_trajectory: true
  trajectory_dir: "./trajectories"
  log_level: "INFO"

prompts:
  system_template: |
    You are an expert mathematician. Solve the following math problem step by step.
    Show your complete reasoning process and put your final answer in \boxed{{}}.

    ## Problem
    {problem}

    ## Context
    **Additional Requirements**: {additional_requirements}
    **Local Memory**: {local_memory}
    **Global Memory**: {global_memory}

    ## Instructions
    1. Analyze the problem carefully and identify key concepts
    2. Show clear, step-by-step mathematical reasoning
    3. Verify your answer before submitting
    4. Put your final numerical answer in \boxed{{}}
    5. If context provides additional requirements or memory, follow them to improve your solution

  optimization_template: |
    Using all information in context, generate a new solution to improve the metric of the solution.

    Please re-analyze the problem and generate an improved solution.
    Focus on correctness and make sure your final answer is in \boxed{{}}.

task_config:
  use_math_verify: true
  strict_box_verify: true
  timeout: 10
